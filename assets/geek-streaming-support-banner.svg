<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GEEK Streaming Support Assistant</title>
  <desc id="desc">Branded project banner in navy, olive, and cream with a troubleshooting decision flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081A2E"/>
      <stop offset="1" stop-color="#173A55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B7B24A"/>
      <stop offset="1" stop-color="#85852F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="38" r="140" fill="#FFFFFF" opacity=".035"/>
  <circle cx="1040" cy="340" r="200" fill="#B7B24A" opacity=".065"/>
  <path d="M0 314 C230 270 390 350 620 306 C820 268 990 310 1200 256 L1200 360 L0 360 Z" fill="#FFFFFF" opacity=".035"/>

  <g transform="translate(58 48)">
    <rect width="92" height="92" rx="46" fill="#F3F0E7"/>
    <circle cx="46" cy="46" r="38" fill="none" stroke="#9A9838" stroke-width="3"/>
    <text x="46" y="53" text-anchor="middle" fill="#0B2137" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">GEEK</text>
  </g>

  <text x="175" y="78" fill="#B7B24A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">PORTFOLIO PROJECT</text>
  <text x="58" y="181" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">GEEK Streaming Support</text>
  <text x="58" y="237" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">Assistant</text>
  <text x="60" y="278" fill="#DDE4EA" font-family="Arial, Helvetica, sans-serif" font-size="21">Tech help without the headache.</text>

  <g transform="translate(760 64)" filter="url(#shadow)">
    <rect x="92" y="0" width="190" height="54" rx="16" fill="#F3F0E7"/>
    <text x="187" y="34" text-anchor="middle" fill="#0B2137" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Choose an issue</text>

    <path d="M187 54 V92 M187 92 H52 V121 M187 92 H322 V121" fill="none" stroke="#B7B24A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="0" y="121" width="105" height="48" rx="14" fill="url(#accent)"/>
    <rect x="117" y="121" width="140" height="48" rx="14" fill="url(#accent)"/>
    <rect x="269" y="121" width="105" height="48" rx="14" fill="url(#accent)"/>
    <text x="52" y="151" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Power</text>
    <text x="187" y="151" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Connection</text>
    <text x="322" y="151" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">A/V</text>

    <path d="M187 169 V210" fill="none" stroke="#B7B24A" stroke-width="4" stroke-linecap="round"/>
    <rect x="84" y="210" width="206" height="54" rx="16" fill="#FFFFFF"/>
    <text x="187" y="243" text-anchor="middle" fill="#0B2137" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Guided next step</text>
  </g>

  <g transform="translate(58 318)">
    <rect width="183" height="28" rx="14" fill="#FFFFFF" opacity=".12"/>
    <text x="91.5" y="19" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">PYTHON PROTOTYPE</text>
    <rect x="195" width="160" height="28" rx="14" fill="#FFFFFF" opacity=".12"/>
    <text x="275" y="19" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">WHIMSICAL FLOW</text>
    <rect x="367" width="145" height="28" rx="14" fill="#FFFFFF" opacity=".12"/>
    <text x="439.5" y="19" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">LANDBOT BUILD</text>
    <rect x="524" width="205" height="28" rx="14" fill="#B7B24A"/>
    <text x="626.5" y="19" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">108 / 108 CHECKS PASSED</text>
  </g>
</svg>